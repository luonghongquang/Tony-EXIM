                        <span><iconify-icon icon="time-outline"></iconify-icon> 10 phút đọc</span>

                <div class="article-body">
                    <p>
                        Ngày <strong>23/01/2026</strong>, Chính phủ đã ban hành <strong>Nghị định số
                        37/2026/NĐ-CP</strong> quy định chi tiết một số điều và biện pháp để tổ chức, hướng dẫn

                    </p>

                        <strong>Điểm cốt lõi:</strong> Nghị định 37/2026/NĐ-CP chuyển từ phương thức quản lý
                        "dàn đều" sang <strong>quản lý dựa trên mức độ rủi ro</strong>, đồng thời đẩy mạnh số hóa
                        dữ liệu, tăng cường hậu kiểm và minh bạch hóa thông tin chất lượng sản phẩm, hàng hóa
                        [reference:1].
                    </div>

                    <h2>I. Bối cảnh ban hành</h2>
                    <p>
                        Nghị định 37/2026/NĐ-CP ra đời trong bối cảnh <strong>Luật số 78/2025/QH15</strong> sửa
                        đổi, bổ sung một số điều của Luật Chất lượng sản phẩm, hàng hóa đã chính thức có hiệu lực
                        từ ngày <strong>01/01/2026</strong>. Trên cơ sở đó, Chính phủ ban hành Nghị định này để
                        cụ thể hóa các quy định mới, tạo hành lang pháp lý cho việc đổi mới toàn diện công tác
                        quản lý chất lượng[reference:2].
                    </p>
                    <p>
                        Nghị định 37/2026/NĐ-CP được ban hành nhằm hoàn thiện khung pháp lý về quản lý chất lượng
                        sản phẩm, hàng hóa, đáp ứng yêu cầu quản lý trong sản xuất, lưu thông và thương mại số
                        [reference:3].
                    </p>

                    <h2>II. Phân loại sản phẩm, hàng hóa theo 3 mức độ rủi ro</h2>
                    <p>
                        Một trong những nội dung quan trọng nhất của Nghị định 37/2026/NĐ-CP là quy định về việc
                        phân loại sản phẩm, hàng hóa theo <strong>3 mức độ rủi ro</strong>. Cụ thể tại Điều 4
                        Nghị định nêu rõ nguyên tắc và phương pháp xác định mức độ rủi ro của sản phẩm, hàng hóa
                        [reference:4].
                    </p>

                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nhóm rủi ro</th>
                                    <th>Đặc điểm</th>
                                    <th>Phương thức quản lý</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>Rủi ro cao</strong></td>
                                    <td>Sản phẩm, hàng hóa có mức độ rủi ro nguy hại lớn và khả năng xảy ra rủi ro cao, có thể gây hậu quả nghiêm trọng hoặc đặc biệt nghiêm trọng nếu không có biện pháp quản lý phù hợp.</td>
                                    <td>Quản lý chặt chẽ thông qua tổ chức chứng nhận được chỉ định, kết hợp kiểm tra định kỳ và đột xuất.</td>

                                    <td>Doanh nghiệp được lựa chọn tự công bố hoặc đánh giá bởi bên thứ ba.</td>
                                </tr>
                                <tr>
                                    <td><strong>Rủi ro thấp</strong></td>
                                    <td>Sản phẩm, hàng hóa có mức độ rủi ro nguy hại nhỏ hoặc khả năng xảy ra rủi ro thấp, hầu như không gây ảnh hưởng đáng kể trong điều kiện kiểm soát hoặc sử dụng thông thường.</td>
                                    <td>Doanh nghiệp tự công bố và tự chịu trách nhiệm.</td>
                                </tr>
                            </tbody>

                    <p>
                        Nguyên tắc xác định mức độ rủi ro được quy định rõ: căn cứ vào bằng chứng khoa học và dữ
                        liệu áp dụng trong thực tiễn; khả năng quản lý của cơ quan nhà nước trong từng thời kỳ;

                    <p>

                    <h2>III. Nhãn điện tử – Bước tiến trong quản lý chất lượng</h2>
                    <p>
                        Một điểm mới nổi bật của Nghị định 37/2026/NĐ-CP là quy định về <strong>nhãn điện
                        tử</strong> đối với sản phẩm, hàng hóa. Từ ngày <strong>01/7/2026</strong>, quy định về
                        nhãn điện tử chính thức có hiệu lực, được kỳ vọng tạo thuận lợi cho doanh nghiệp trong
                        việc cung cấp, cập nhật thông tin sản phẩm, nâng cao tính minh bạch, khả năng truy xuất
                        nguồn gốc và bảo vệ quyền lợi người tiêu dùng[reference:7].
                    </p>
                    <p>
                        Chỉ cần một lần quét mã trên sản phẩm, người tiêu dùng có thể kiểm tra nhanh thông tin
                        chất lượng – đây là điểm mới nổi bật của Nghị định 37/2026/NĐ-CP, nhằm triển khai
                        <strong>"hộ chiếu số của sản phẩm"</strong>[reference:8].
                    </p>

                    <div class="highlight-box">
                        <iconify-icon icon="bulb-outline" style="font-size: 1.1rem;"></iconify-icon>
                        <strong>Ý nghĩa:</strong> Nhãn điện tử không chỉ giúp minh bạch hóa thông tin sản phẩm
                        mà còn là nền tảng quan trọng để thúc đẩy chuyển đổi số trong quản lý chất lượng, hướng
                        tới xây dựng hạ tầng chất lượng quốc gia số.
                    </div>

                    <h2>IV. Lộ trình áp dụng và quy định chuyển tiếp</h2>
                    <p>
                        Theo Nghị định 37/2026/NĐ-CP, trong thời hạn <strong>6 tháng</strong> kể từ ngày Nghị
                        định có hiệu lực thi hành, việc quản lý chất lượng sản phẩm, hàng hóa tiếp tục thực hiện
                        theo các quy định hiện hành[reference:9].
                    </p>
                    <p>
                        Bên cạnh đó, các Bộ quản lý ngành, lĩnh vực có trách nhiệm ban hành Danh mục sản phẩm
                        rủi ro trung bình, rủi ro cao trước ngày <strong>01/7/2026</strong> để làm cơ sở triển
                        khai thực hiện[reference:10].
                    </p>
                    <p>
                        Kể từ ngày <strong>01/7/2026</strong>, việc kiểm tra chất lượng sản phẩm hàng hóa được
                        thực hiện trên cơ sở Danh mục sản phẩm rủi ro trung bình và rủi ro cao theo quy định tại
                        Nghị định 37/2026/NĐ-CP[reference:11].
                    </p>

                    <h2>V. Tác động đối với doanh nghiệp xuất nhập khẩu</h2>
                    <p>
                        Nghị định 37/2026/NĐ-CP có tác động trực tiếp đến hoạt động xuất nhập khẩu của doanh
                        nghiệp, đặc biệt trong lĩnh vực kiểm tra chất lượng hàng hóa nhập khẩu. Cụ thể:
                    </p>
                    <ul>
                        <li>
                            <strong>Thống nhất quy định:</strong> Nghị định tạo cơ sở pháp lý thống nhất cho việc
                            kiểm tra chất lượng hàng hóa nhập khẩu, góp phần gỡ vướng trong thực tiễn triển khai
                            [reference:12].
                        </li>
                        <li>
                            <strong>Phân loại rủi ro:</strong> Doanh nghiệp cần xác định đúng nhóm rủi ro của
                            sản phẩm, hàng hóa để áp dụng đúng phương thức quản lý, tránh rủi ro pháp lý và tối
                            ưu hóa chi phí.
                        </li>
                        <li>
                            <strong>Chuyển đổi số:</strong> Việc áp dụng nhãn điện tử và truy xuất nguồn gốc
                            đòi hỏi doanh nghiệp phải chủ động cập nhật, số hóa thông tin sản phẩm để đáp ứng
                            yêu cầu mới.
                        </li>
                        <li>
                            <strong>Hậu kiểm:</strong> Cơ chế hậu kiểm được tăng cường, doanh nghiệp cần duy
                            trì hồ sơ chất lượng đầy đủ và sẵn sàng giải trình khi có yêu cầu từ cơ quan chức
                            năng.
                        </li>
                    </ul>
