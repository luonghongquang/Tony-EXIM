                        <span><iconify-icon icon="time-outline"></iconify-icon> 10 phút đọc</span>
                    </div>
                </header>

                <div class="article-body">
                    <p>
                        Phân loại mã HS code là <strong>bước đầu tiên và vô cùng quan trọng</strong> trong quy
                        trình khai báo hải quan. Việc xác định sai mã có thể dẫn đến <strong>sai lệch thuế,
                        chậm thông quan hoặc bị xử phạt hành chính</strong>. Kể từ ngày
                        <strong>01/02/2026</strong>, cơ quan Hải quan chính thức áp dụng Quy trình xác định
                        trước mã số; kiểm tra tên hàng, mô tả hàng hóa, mã số, mức thuế trong thông quan và
                        thống nhất công tác phân loại hàng hóa theo <strong>Quyết định số
                        117/QĐ-CHQ</strong> ngày 20/01/2026 của Cục trưởng Cục Hải quan.
                    </p>

                    <div class="highlight-box">
                        <iconify-icon icon="alert-circle-outline" style="font-size: 1.1rem;"></iconify-icon>
                        <strong>Điểm cốt lõi:</strong> Quyết định 117/QĐ-CHQ thay thế Quyết định số
                        1921/QĐ-TCHQ ngày 28/6/2018, chuẩn hóa quy trình phân loại, xác định trước mã số
                        và kiểm tra hàng hóa trong thông quan. Mọi kết quả phân loại đều có
                        <strong>giá trị pháp lý bắt buộc áp dụng thống nhất</strong> tại tất cả các chi
                        cục hải quan, loại bỏ hoàn toàn rủi ro mỗi nơi áp một mã số khác nhau cho cùng
                        một mặt hàng.
                    </div>

                    <h2>I. Mã HS code là gì và vì sao bắt buộc?</h2>
                    <p>
                        Phân loại mã HS (Harmonized System) là quá trình xác định mã số hàng hóa trong
                        biểu thuế, giúp cơ quan hải quan áp dụng đúng mức thuế và chính sách quản lý với
                        từng mặt hàng. Mỗi mã HS gồm <strong>8 chữ số</strong> đối với hàng nhập khẩu tại
                        Việt Nam và phản ánh đầy đủ bản chất, thành phần, mục đích sử dụng hàng hóa.
                    </p>
                    <p>
                        Việc phân loại mã HS sai dễ khiến doanh nghiệp bị <strong>áp mức thuế cao hơn, bị
                        truy thu thuế hoặc xử phạt hành chính</strong>. Ngoài ra, sai mã HS còn dẫn đến
                        việc <strong>xin giấy phép, kiểm tra chuyên ngành không đúng yêu cầu pháp
                        luật</strong>.
                    </p>

                    <h2>II. Quy trình phân loại hàng hóa theo Quyết định 117/QĐ-CHQ</h2>
                    <p>
                        Theo Quyết định 117/QĐ-CHQ, quy trình phân loại hàng hóa được thực hiện thống
                        nhất trên toàn hệ thống hải quan, bao gồm các bước chính sau:
                    </p>

                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Bước</th>
                                    <th>Nội dung</th>
                                    <th>Trách nhiệm</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>Bước 1</strong></td>
                                    <td><strong>Tự phân loại và khai báo:</strong> Doanh nghiệp tự phân loại, khai báo mã HS trên tờ khai hải quan theo Danh mục hàng hóa xuất nhập khẩu Việt Nam.</td>
                                    <td>Người khai hải quan</td>
                                </tr>
                                <tr>
                                    <td><strong>Bước 2</strong></td>
                                    <td><strong>Kiểm tra tính chính xác:</strong> Cơ quan hải quan kiểm tra tính chính xác của mã HS đã khai dựa trên hồ sơ, tài liệu kỹ thuật kèm theo.</td>
                                    <td>Công chức hải quan</td>
                                </tr>
                                <tr>
                                    <td><strong>Bước 3</strong></td>
                                    <td><strong>Yêu cầu bổ sung:</strong> Nếu nghi ngờ sai mã, cơ quan yêu cầu doanh nghiệp cung cấp thêm hồ sơ, tài liệu kỹ thuật hoặc lấy mẫu phân tích.</td>
                                    <td>Công chức hải quan</td>
                                </tr>
                                <tr>
                                    <td><strong>Bước 4</strong></td>
                                    <td><strong>Kết luận và thông báo:</strong> Cơ quan hải quan ban hành Thông báo kết quả phân loại, có giá trị pháp lý bắt buộc áp dụng thống nhất tại tất cả các chi cục hải quan.</td>
                                    <td>Ban Nghiệp vụ thuế hải quan</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <p>
                        Theo quy trình mới, <strong>Ban Nghiệp vụ thuế hải quan (Cục Hải quan)</strong> sẽ
                        thực hiện kiểm tra sơ bộ hồ sơ trong vòng <strong>5 ngày làm việc</strong>. Các
                        trường hợp thiếu tài liệu kỹ thuật, catalogue hoặc bản phân tích thành phần sẽ bị
                        từ chối xử lý ngay lập tức để tránh gây tồn đọng hồ sơ không cần thiết.
                    </p>
                    <p>
                        Trong giai đoạn thẩm định chuyên sâu, công chức Tổ phân loại thực hiện đối chiếu
                        hàng hóa với <strong>Cơ sở dữ liệu MHS</strong> và <strong>Danh mục hàng hóa xuất
                        nhập khẩu Việt Nam</strong>. Đối với những mặt hàng có cấu tạo hoặc tính chất kỹ
                        thuật phức tạp, quy trình bắt buộc phải lấy ý kiến từ các đơn vị kiểm định hoặc
                        tham vấn chuyên gia ngành trước khi ban hành thông báo kết quả.
                    </p>

                    <h2>III. Thời hạn giải quyết và thẩm quyền</h2>
                    <p>
                        Quy trình xác định trước mã số quy định rõ thời hạn giải quyết như sau:
                    </p>
                    <ul>
                        <li>
                            <strong>05 ngày làm việc:</strong> Thời hạn ban hành Thông báo kết quả phân
                            tích đối với trường hợp thông thường.
                        </li>
                        <li>
                            <strong>20 ngày làm việc:</strong> Thời hạn ban hành Thông báo kết quả phân
                            tích đối với trường hợp phức tạp, cần lấy ý kiến chuyên gia hoặc kiểm định
                            chuyên sâu.
                        </li>
                    </ul>
                    <p>
                        Thẩm quyền ban hành kết quả phân tích, phân loại được giao trực tiếp cho
                        <strong>Đội trưởng Đội Kiểm định hải quan</strong>. Đồng thời, văn bản hướng dẫn
                        phân loại chỉ áp dụng đối với các văn bản do <strong>Cục trưởng Cục Hải quan ban
                        hành</strong>, bảo đảm tính thống nhất cao nhất trên toàn hệ thống.
                    </p>

                    <h2>IV. Kiểm tra tên hàng, mô tả hàng hóa trong thông quan</h2>
                    <p>
                        Khi hàng hóa bắt đầu làm thủ tục tại cửa khẩu, việc <strong>kiểm tra tên hàng và
                        mô tả hàng hóa</strong> trở thành chốt chặn quan trọng nhất để chống gian lận
                        thuế. Công chức Hải quan có trách nhiệm soi chiếu kỹ lưỡng các thông số cốt lõi
                        như:
                    </p>
                    <ul>
                        <li>Thành phần cấu tạo</li>
                        <li>Model, công suất</li>
                        <li>Mục đích sử dụng</li>
                    </ul>
                    <p>
                        Những trường hợp doanh nghiệp mô tả hàng hóa một cách <strong>chung chung, không
                        rõ bản chất kỹ thuật</strong> hoặc cố tình gây hiểu lầm để hưởng mức thuế suất
                        thấp sẽ bị hệ thống cảnh báo và yêu cầu giải trình bổ sung ngay tại thời điểm
                        kiểm tra hồ sơ.
                    </p>

                    <div class="highlight-box">
                        <iconify-icon icon="warning-outline" style="font-size: 1.1rem;"></iconify-icon>
                        <strong>Lưu ý:</strong> Quy trình xác định trước mã số quy định rõ nếu phát hiện
                        sự không tương thích giữa mô tả hàng hóa thực tế và mã số thuế khai báo, cơ quan
                        Hải quan sẽ tiến hành xử lý theo quy định, bao gồm truy thu thuế và xử phạt hành
                        chính nếu có dấu hiệu gian lận.
                    </div>

                    <h2>V. Lưu ý quan trọng cho doanh nghiệp</h2>
                    <p>
                        Để đảm bảo quá trình phân loại mã HS diễn ra thuận lợi, doanh nghiệp cần chú ý
                        các điểm sau:
                    </p>
                    <ul>
                        <li>
                            <strong>Chuẩn bị hồ sơ kỹ thuật đầy đủ:</strong> Tài liệu kỹ thuật, catalogue,
                            bản phân tích thành phần, hình ảnh hàng hóa cần được chuẩn bị kỹ lưỡng trước
                            khi làm thủ tục.
                        </li>
                        <li>
                            <strong>Mô tả hàng hóa rõ ràng:</strong> Tránh mô tả chung chung, không rõ bản
                            chất kỹ thuật; ghi đầy đủ thành phần, cấu tạo, công dụng, đặc tính kỹ thuật và
                            quy trình sản xuất của hàng hóa.
                        </li>
                        <li>
                            <strong>Sử dụng dịch vụ xác định trước mã số:</strong> Đối với hàng hóa phức
                            tạp, doanh nghiệp nên chủ động đăng ký xác định trước mã số để tránh rủi ro
                            trong quá trình thông quan.
                        </li>
                        <li>
                            <strong>Cập nhật quy định mới:</strong> Theo dõi các văn bản hướng dẫn phân
                            loại do Cục trưởng Cục Hải quan ban hành để áp dụng đúng quy định.
                        </li>
                    </ul>
