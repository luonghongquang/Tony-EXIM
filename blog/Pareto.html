<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Đồ Pareto - Cắt Chính Xác Giao Điểm 80%</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js Core -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .table-container::-webkit-scrollbar { width: 6px; height: 6px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .sticky-col { position: sticky; left: 0; z-index: 10; background-color: #ffffff; border-right: 1px solid #e2e8f0; }
        thead .sticky-col { z-index: 30; background-color: #f1f5f9; }
        tr:hover .sticky-col { background-color: #f8fafc; }

        input { transition: all 0.2s ease; }
        input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        
        .percent-text { color: #059669; font-weight: 700; }
    </style>
</head>
<body class="text-slate-800 antialiased pb-12">

    <header class="bg-gradient-to-r from-slate-800 to-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex items-center justify-between">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight flex items-center gap-3">
                    <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    Biểu Đồ Pareto Tương Tác
                </h1>
                <p class="text-slate-300 mt-1 text-sm md:text-base">Đường cắt dọc tự động nội suy theo giao điểm 80%</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">
            
            <!-- Cột Trái: Bảng Dữ Liệu -->
            <div class="xl:col-span-5 flex flex-col gap-6 fade-in">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[550px]">
                    <div class="bg-slate-50 px-5 py-4 border-b border-slate-200">
                        <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Bảng Dữ Liệu Lỗi
                        </h2>
                    </div>
                    
                    <div class="px-4 py-3 bg-white border-b border-slate-200 flex gap-2">
                        <button onclick="addRow()" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium py-1.5 px-2 rounded-lg text-sm transition-colors border border-blue-200">+ Thêm Dòng</button>
                        <button onclick="loadSampleData()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-1.5 px-2 rounded-lg text-sm transition-colors border border-slate-300">Tải Lại Mẫu</button>
                    </div>

                    <div class="flex-1 overflow-auto table-container relative bg-white">
                        <table class="w-full text-sm text-left border-collapse">
                            <thead class="text-xs text-slate-600 uppercase bg-slate-100 sticky top-0 z-20 shadow-sm">
                                <tr>
                                    <th class="sticky-col px-3 py-3 border-b w-44 z-30 text-center">Loại Lỗi</th>
                                    <th class="px-2 py-3 border-b w-24 text-center text-blue-700">Số lượng</th>
                                    <th class="px-2 py-3 border-b w-20 text-center text-emerald-700">Tỷ lệ</th>
                                    <th class="px-2 py-3 border-b w-10 text-center"></th>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Cột Phải: Biểu Đồ -->
            <div class="xl:col-span-7 flex flex-col gap-6 fade-in" style="animation-delay: 0.1s;">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <!-- Chú thích -->
                    <div class="flex justify-center gap-8 items-center mb-4 mt-2">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-3 bg-[#4b7bec] rounded-sm"></span>
                            <span class="font-bold text-sm text-slate-700">Số lỗi</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-1 bg-[#dc2626] rounded-full relative">
                                <span class="absolute -top-1 left-1/2 -translate-x-1/2 w-3 h-3 bg-[#f97316] rounded-full border-2 border-white"></span>
                            </span>
                            <span class="font-bold text-sm text-slate-700">Tỉ lệ phần trăm tích lũy</span>
                        </div>
                    </div>
                    
                    <!-- Vùng vẽ biểu đồ -->
                    <div class="relative w-full h-[450px]">
                        <canvas id="paretoChart"></canvas>
                    </div>
                </div>

                <!-- Vùng phân tích -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div id="analysisPanel" class="p-5"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let rowNames = ["Chỉ dư, xén dơ", "Lệch chi tiết", "Mất nét, lem, lệch", "Lệch màu", "Độ dày, vật không đúng tiêu chuẩn"];
        let rowValues = [35, 15, 12, 5, 4]; // Sử dụng bộ dữ liệu giống hình bạn gửi để test
        let myChart = null;

        function loadSampleData() {
            rowNames = ["Chỉ dư, xén dơ", "Lệch chi tiết", "Mất nét, lem, lệch", "Lệch màu", "Độ dày, vật không đúng tiêu chuẩn"];
            rowValues = [35, 15, 12, 5, 4];
            renderTable();
            updateDashboard();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const total = rowValues.reduce((a, b) => a + b, 0);
            let html = '';
            
            rowNames.forEach((name, index) => {
                let pct = total > 0 ? ((rowValues[index] / total) * 100).toFixed(1) : 0;
                
                html += `
                <tr class="bg-white border-b hover:bg-slate-50 transition-colors group">
                    <td class="sticky-col px-2 py-2 border-r">
                        <input type="text" value="${name}" onchange="updateRowName(${index}, this.value)" 
                            class="w-full bg-transparent border border-transparent hover:border-slate-300 focus:bg-white focus:border-blue-500 rounded px-1 py-1 text-sm font-medium text-slate-700">
                    </td>
                    <td class="px-2 py-2">
                        <input type="number" min="0" value="${rowValues[index]}" onchange="updateValue(${index}, this.value)" 
                            class="w-full bg-transparent border border-transparent hover:border-slate-300 focus:bg-white focus:border-blue-500 rounded px-2 py-1 text-center font-bold text-slate-800">
                    </td>
                    <td class="px-2 py-2 text-center percent-text text-sm">
                        ${pct}%
                    </td>
                    <td class="px-2 py-2 text-center">
                        <button onclick="removeRow(${index})" class="text-red-400 hover:text-red-600 font-bold text-lg leading-none opacity-0 group-hover:opacity-100 transition-opacity">&times;</button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function updateValue(index, val) {
            rowValues[index] = parseInt(val) || 0;
            renderTable();
            updateDashboard();
        }

        function updateRowName(index, val) {
            rowNames[index] = val || `Lỗi ${index+1}`;
            updateDashboard();
        }

        function addRow() {
            rowNames.push(`Lỗi mới ${rowNames.length + 1}`);
            rowValues.push(0);
            renderTable();
            updateDashboard();
        }

        function removeRow(index) {
            if (rowNames.length > 2) {
                rowNames.splice(index, 1);
                rowValues.splice(index, 1);
                renderTable();
                updateDashboard();
            }
        }

        // --- CUSTOM PLUGIN: TÍNH TOÁN NỘI SUY ĐỂ CẮT CHÍNH XÁC ---
        const paretoCustomPlugin = {
            id: 'paretoCustomElements',
            afterDatasetsDraw: (chart) => {
                const ctx = chart.ctx;
                const metaLine = chart.getDatasetMeta(1); 
                const yAxisRight = chart.scales.y1;
                const chartArea = chart.chartArea;
                
                const displayPercents = chart.config._config.customData.percents;

                if (!metaLine || metaLine.data.length < 2) return;

                // 1. HÌNH VUÔNG XANH TẠI ĐIỂM NEO ĐẦU TIÊN
                const firstPoint = metaLine.data[0];
                if (firstPoint) {
                    const boxSize = 30;
                    ctx.save();
                    ctx.beginPath();
                    ctx.strokeStyle = '#22c55e';
                    ctx.lineWidth = 2.5;
                    ctx.strokeRect(firstPoint.x - boxSize / 2, firstPoint.y - boxSize / 2, boxSize, boxSize);
                    ctx.restore();
                }

                // 2. TÌM GIAO ĐIỂM NỘI SUY VỚI MỐC 80%
                let xIntersect = -1;
                
                // Duyệt mảng để tìm 2 điểm bao quanh mốc 80%
                for (let i = 1; i < displayPercents.length; i++) {
                    let y1 = displayPercents[i - 1]; // % của cột trước
                    let y2 = displayPercents[i];     // % của cột hiện tại
                    
                    if (y1 < 80 && y2 >= 80) {
                        // Công thức nội suy tuyến tính để tìm tọa độ X chính xác
                        // Tỷ lệ khoảng cách từ điểm 1 đến mốc 80
                        let ratio = (80 - y1) / (y2 - y1); 
                        
                        // Tọa độ pixel X của 2 tâm cột
                        let x1Pixel = metaLine.data[i - 1].x;
                        let x2Pixel = metaLine.data[i].x;
                        
                        // Tính tọa độ X của giao điểm
                        xIntersect = x1Pixel + ratio * (x2Pixel - x1Pixel);
                        break;
                    }
                }

                // 3. VẼ ĐƯỜNG ĐỨT NÉT TẠI GIAO ĐIỂM
                const y80Pixel = yAxisRight.getPixelForValue(80);

                if (xIntersect !== -1) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.setLineDash([6, 4]); 
                    ctx.strokeStyle = '#facc15'; // Vàng
                    ctx.lineWidth = 2;
                    
                    // Đường ngang xuyên suốt biểu đồ
                    ctx.moveTo(chartArea.right, y80Pixel); 
                    ctx.lineTo(chartArea.left, y80Pixel);
                    
                    // Đường dọc cắt xuống từ đúng giao điểm XIntersect
                    ctx.moveTo(xIntersect, y80Pixel);
                    ctx.lineTo(xIntersect, chartArea.bottom);
                    
                    ctx.stroke();
                    ctx.restore();
                }

                // 4. VẼ NHÃN % VÀ ĐƯỜNG GIÓNG
                ctx.save();
                ctx.fillStyle = '#374151'; 
                ctx.font = '600 12px Inter';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';

                metaLine.data.forEach((point, index) => {
                    const val = displayPercents[index];
                    const x = point.x;
                    const y = point.y;
                    
                    const labelX = x + 15;
                    const labelY = y - 30;

                    ctx.beginPath();
                    ctx.strokeStyle = '#9ca3af'; 
                    ctx.lineWidth = 1;
                    ctx.setLineDash([]); 
                    ctx.moveTo(x, y);
                    ctx.lineTo(labelX, labelY);
                    ctx.lineTo(labelX + 30, labelY);
                    ctx.stroke();

                    ctx.fillText(Math.round(val) + '%', labelX + 2, labelY - 8);
                });
                ctx.restore();
            }
        };

        function updateDashboard() {
            let dataObj = rowNames.map((name, i) => ({ name, value: rowValues[i] }));
            dataObj.sort((a, b) => b.value - a.value);

            const total = dataObj.reduce((sum, item) => sum + item.value, 0);
            if (total === 0) return;

            const labels = dataObj.map(d => d.name);
            const counts = dataObj.map(d => d.value);
            
            let cumulativePercent = 0;
            const cumulativePercents = dataObj.map(item => {
                cumulativePercent += (item.value / total) * 100;
                return cumulativePercent;
            });

            const maxYLeft = 100; 
            const maxYRight = 120; 
            
            // Neo điểm đầu tiên lên đỉnh cột
            const lineDataToDraw = cumulativePercents.map((pct, i) => {
                if (i === 0) return counts[0] * (maxYRight / maxYLeft);
                return pct;
            });

            const ctx = document.getElementById('paretoChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Số lỗi',
                            data: counts,
                            backgroundColor: '#4b7bec',
                            barPercentage: 0.6,
                            categoryPercentage: 0.8,
                            yAxisID: 'y',
                            order: 2
                        },
                        {
                            type: 'line',
                            label: 'Tỉ lệ phần trăm tích lũy',
                            data: lineDataToDraw,
                            borderColor: '#dc2626', 
                            backgroundColor: '#f97316', 
                            borderWidth: 3,
                            pointBackgroundColor: '#f97316',
                            pointBorderColor: '#ffffff',
                            pointBorderWidth: 1.5,
                            pointRadius: 5,
                            pointHoverRadius: 7,
                            tension: 0, 
                            yAxisID: 'y1',
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { top: 40, right: 40, left: 10 } },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleFont: { family: 'Inter', size: 13 },
                            bodyFont: { family: 'Inter', size: 14, weight: 'bold' },
                            padding: 10,
                            callbacks: {
                                label: function(context) {
                                    if (context.datasetIndex === 0) return ` Số lượng: ${context.parsed.y}`;
                                    return ` Tích lũy: ${cumulativePercents[context.dataIndex].toFixed(1)}%`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { font: { family: 'Inter', size: 12 }, color: '#4b5563', maxRotation: 0, autoSkip: false }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            beginAtZero: true,
                            max: maxYLeft,
                            grid: { color: '#f3f4f6' },
                            ticks: { font: { family: 'Inter' }, stepSize: 20, color: '#6b7280' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            beginAtZero: true,
                            max: maxYRight,
                            grid: { drawOnChartArea: false },
                            ticks: {
                                callback: function(value) { return value + "%"; },
                                font: { family: 'Inter' },
                                stepSize: 20,
                                color: '#6b7280'
                            }
                        }
                    }
                },
                customData: { percents: cumulativePercents }, 
                plugins: [paretoCustomPlugin] 
            });

            renderAnalysis(cumulativePercents, labels, counts, total);
        }

        function renderAnalysis(cumPercents, labels, counts, total) {
            const panel = document.getElementById('analysisPanel');
            let idx80 = cumPercents.findIndex(v => v >= 80);
            if (idx80 === -1) idx80 = cumPercents.length - 1;
            let focusNames = labels.slice(0, idx80 + 1);
            let firstItemPct = ((counts[0] / total) * 100).toFixed(1);

            panel.innerHTML = `
                <div class="p-4 rounded-xl border border-yellow-200 bg-yellow-50">
                    <h3 class="font-bold text-lg mb-2 text-yellow-800 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Phân Tích & Vùng Trọng Yếu
                    </h3>
                    <p class="text-sm text-slate-700 leading-relaxed mb-3">
                        Đường cắt dọc màu vàng được tính toán động bằng phương pháp nội suy, luôn đi qua chính xác giao điểm của đường tích lũy và mốc 80%, bất kể dữ liệu thay đổi thế nào.
                    </p>
                    <p class="text-sm text-slate-700 leading-relaxed">
                        Theo quy tắc 80/20, chỉ với <b>${idx80 + 1} loại lỗi</b> đầu tiên đã chiếm tới <b class="text-yellow-700">${cumPercents[idx80].toFixed(1)}%</b> tổng số lỗi. Đây là vùng trọng yếu cần ưu tiên khắc phục.
                    </p>
                </div>
            `;
        }

        window.onload = () => { loadSampleData(); };
    </script>
</body>
</html>
