<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Sampling Analysis</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Hiệu ứng nút bấm mượt mà trên Mobile */
        .btn-press { transition: all 0.1s ease; }
        .btn-press:active { transform: scale(0.92); box-shadow: inset 0 4px 8px rgba(0,0,0,0.15); }
        
        /* Ẩn mũi tên tăng giảm của input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Tùy chỉnh thanh cuộn */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24">

    <!-- Header -->
    <header class="bg-indigo-950 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center max-w-5xl">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg shadow-inner">
                    <i class="fa-solid fa-clipboard-list text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">Work Sampling</h1>
                    <p class="text-[10px] text-indigo-300 uppercase tracking-wider">Phân tích hoạt động</p>
                </div>
            </div>
            <button onclick="resetData()" class="text-indigo-300 hover:text-white transition-colors p-2 text-sm font-semibold border border-indigo-800 rounded-lg bg-indigo-900/50">
                <i class="fa-solid fa-rotate-left mr-1"></i> Reset
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-5xl space-y-6">
        
        <!-- PHẦN 1: THIẾT LẬP & TIẾN ĐỘ -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                <div class="w-full md:w-1/2">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Mục tiêu số lần quan sát</label>
                    <div class="relative">
                        <input type="number" id="targetObs" value="100" min="1"
                            oninput="updateProgress()"
                            class="w-full bg-slate-50 border border-slate-300 text-slate-800 font-bold rounded-xl px-4 py-3 pr-16 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all text-lg">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">Lần</span>
                    </div>
                </div>
                
                <div class="w-full md:w-1/2 flex justify-between md:justify-end gap-6 text-center">
                    <div>
                        <p class="text-xs font-semibold text-slate-500 uppercase">Đã quan sát</p>
                        <p class="text-3xl font-black text-indigo-700" id="totalObservedDisplay">0</p>
                    </div>
                    <div>
                        <p class="text-xs font-semibold text-slate-500 uppercase">Còn lại</p>
                        <p class="text-3xl font-black text-slate-400" id="remainingDisplay">100</p>
                    </div>
                </div>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 rounded-full h-3 mt-2 overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- PHẦN 2: CÁC NÚT ĐẾM (MOBILE FRIENDLY) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            
            <!-- Nút Working -->
            <button onclick="increment('working')" class="btn-press bg-emerald-500 hover:bg-emerald-600 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden group border-b-4 border-emerald-700">
                <div class="absolute right-0 top-0 opacity-10 text-9xl -mt-4 -mr-4 transform group-hover:scale-110 transition-transform"><i class="fa-solid fa-person-digging"></i></div>
                <div class="relative z-10 flex flex-col items-center">
                    <i class="fa-solid fa-briefcase text-4xl mb-3 opacity-90"></i>
                    <h3 class="text-xl font-bold uppercase tracking-wider mb-2">Làm việc</h3>
                    <div class="text-6xl font-black bg-white/20 px-6 py-2 rounded-2xl" id="count-working">0</div>
                </div>
            </button>

            <!-- Nút Idle -->
            <button onclick="increment('idle')" class="btn-press bg-rose-500 hover:bg-rose-600 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden group border-b-4 border-rose-700">
                <div class="absolute right-0 top-0 opacity-10 text-9xl -mt-4 -mr-4 transform group-hover:scale-110 transition-transform"><i class="fa-solid fa-hourglass-half"></i></div>
                <div class="relative z-10 flex flex-col items-center">
                    <i class="fa-solid fa-pause text-4xl mb-3 opacity-90"></i>
                    <h3 class="text-xl font-bold uppercase tracking-wider mb-2">Đang chờ</h3>
                    <div class="text-6xl font-black bg-white/20 px-6 py-2 rounded-2xl" id="count-idle">0</div>
                </div>
            </button>

            <!-- Nút Personal -->
            <button onclick="increment('personal')" class="btn-press bg-amber-500 hover:bg-amber-600 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden group border-b-4 border-amber-700">
                <div class="absolute right-0 top-0 opacity-10 text-9xl -mt-4 -mr-4 transform group-hover:scale-110 transition-transform"><i class="fa-solid fa-mug-hot"></i></div>
                <div class="relative z-10 flex flex-col items-center">
                    <i class="fa-solid fa-user-clock text-4xl mb-3 opacity-90"></i>
                    <h3 class="text-xl font-bold uppercase tracking-wider mb-2">Tạm nghỉ</h3>
                    <div class="text-6xl font-black bg-white/20 px-6 py-2 rounded-2xl" id="count-personal">0</div>
                </div>
            </button>

        </div>

        <!-- PHẦN 3: BIỂU ĐỒ & KẾT QUẢ -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 pt-4">
            
            <!-- Biểu đồ -->
            <div class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-center items-center relative min-h-[300px]">
                <h2 class="text-sm font-bold text-slate-600 absolute top-4 left-6 uppercase tracking-wider"><i class="fa-solid fa-chart-pie text-indigo-500 mr-2"></i> Tỷ lệ phân bổ</h2>
                
                <div class="w-full max-w-[280px] mt-6 relative">
                    <canvas id="wsChart"></canvas>
                    <!-- Text ở giữa biểu đồ (Doughnut) -->
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none mt-2">
                        <span class="text-xs text-slate-400 font-semibold uppercase">Tổng</span>
                        <span class="text-2xl font-black text-slate-700" id="chartCenterTotal">0</span>
                    </div>
                </div>
            </div>

            <!-- Kết quả chi tiết -->
            <div class="lg:col-span-5 space-y-4">
                
                <!-- Tỷ lệ hoạt động (Utilization Rate) -->
                <div class="bg-indigo-900 rounded-2xl p-6 shadow-lg text-white text-center relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 opacity-10 text-8xl"><i class="fa-solid fa-gauge-high"></i></div>
                    <h3 class="text-indigo-200 text-sm font-bold uppercase tracking-widest mb-1">Tỷ lệ Hoạt động (Utilization)</h3>
                    <div class="flex items-baseline justify-center gap-1 mt-2">
                        <span class="text-6xl font-black text-emerald-400" id="utilizationRate">0.0</span>
                        <span class="text-2xl text-indigo-300">%</span>
                    </div>
                    <p class="text-xs text-indigo-300 mt-3 bg-indigo-950/50 py-1 px-3 rounded-full inline-block">Công thức: (Làm việc / Tổng) × 100</p>
                </div>

                <!-- Bảng chi tiết -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden text-sm">
                    <table class="w-full">
                        <thead class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 uppercase">
                            <tr>
                                <th class="px-4 py-3 text-left font-bold">Trạng thái</th>
                                <th class="px-4 py-3 text-center font-bold">Số lần</th>
                                <th class="px-4 py-3 text-right font-bold">Tỷ lệ (%)</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <tr>
                                <td class="px-4 py-3 font-semibold text-emerald-600 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500"></span>Làm việc</td>
                                <td class="px-4 py-3 text-center font-bold" id="detail-working-count">0</td>
                                <td class="px-4 py-3 text-right font-bold text-emerald-600" id="detail-working-pct">0.0%</td>
                            </tr>
                            <tr>
                                <td class="px-4 py-3 font-semibold text-rose-600 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-rose-500"></span>Đang chờ</td>
                                <td class="px-4 py-3 text-center font-bold" id="detail-idle-count">0</td>
                                <td class="px-4 py-3 text-right font-bold text-rose-600" id="detail-idle-pct">0.0%</td>
                            </tr>
                            <tr>
                                <td class="px-4 py-3 font-semibold text-amber-600 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-500"></span>Tạm nghỉ</td>
                                <td class="px-4 py-3 text-center font-bold" id="detail-personal-count">0</td>
                                <td class="px-4 py-3 text-right font-bold text-amber-600" id="detail-personal-pct">0.0%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 1. STATE
        let state = {
            target: 100,
            working: 0,
            idle: 0,
            personal: 0
        };

        // 2. CHART.JS SETUP
        const ctx = document.getElementById('wsChart').getContext('2d');
        const wsChart = new Chart(ctx, {
            type: 'doughnut', // Doughnut hiện đại hơn Pie truyền thống
            data: {
                labels: ['Làm việc', 'Đang chờ', 'Tạm nghỉ'],
                datasets: [{
                    data: [0, 0, 0],
                    backgroundColor: [
                        '#10B981', // emerald-500
                        '#F43F5E', // rose-500
                        '#F59E0B'  // amber-500
                    ],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                cutout: '75%', // Tạo khoảng trống ở giữa để chèn text
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: { family: 'Inter', size: 12, weight: '500' },
                            usePointStyle: true,
                            padding: 20
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.label || '';
                                if (label) { label += ': '; }
                                if (context.parsed !== null) {
                                    label += context.parsed + ' lần';
                                }
                                return label;
                            }
                        }
                    }
                }
            }
        });

        // 3. HÀM CẬP NHẬT GIAO DIỆN
        function updateUI() {
            // Cập nhật số đếm trên các nút
            document.getElementById('count-working').innerText = state.working;
            document.getElementById('count-idle').innerText = state.idle;
            document.getElementById('count-personal').innerText = state.personal;

            // Tính tổng đã quan sát
            const total = state.working + state.idle + state.personal;
            
            // Cập nhật Progress Bar
            document.getElementById('totalObservedDisplay').innerText = total;
            document.getElementById('chartCenterTotal').innerText = total;
            
            const remaining = Math.max(0, state.target - total);
            document.getElementById('remainingDisplay').innerText = remaining;

            let progressPct = 0;
            if (state.target > 0) {
                progressPct = Math.min(100, (total / state.target) * 100);
            }
            document.getElementById('progressBar').style.width = `${progressPct}%`;

            // Đổi màu thanh tiến độ khi đạt mục tiêu
            if (progressPct >= 100) {
                document.getElementById('progressBar').classList.replace('bg-indigo-600', 'bg-emerald-500');
            } else {
                document.getElementById('progressBar').classList.replace('bg-emerald-500', 'bg-indigo-600');
            }

            // Tính toán tỷ lệ %
            let pctWorking = 0;
            let pctIdle = 0;
            let pctPersonal = 0;

            if (total > 0) {
                pctWorking = (state.working / total) * 100;
                pctIdle = (state.idle / total) * 100;
                pctPersonal = (state.personal / total) * 100;
            }

            // Cập nhật Tỷ lệ hoạt động (Utilization Rate)
            document.getElementById('utilizationRate').innerText = pctWorking.toFixed(1);

            // Cập nhật bảng chi tiết
            document.getElementById('detail-working-count').innerText = state.working;
            document.getElementById('detail-working-pct').innerText = `${pctWorking.toFixed(1)}%`;

            document.getElementById('detail-idle-count').innerText = state.idle;
            document.getElementById('detail-idle-pct').innerText = `${pctIdle.toFixed(1)}%`;

            document.getElementById('detail-personal-count').innerText = state.personal;
            document.getElementById('detail-personal-pct').innerText = `${pctPersonal.toFixed(1)}%`;

            // Cập nhật Biểu đồ Chart.js
            wsChart.data.datasets[0].data = [state.working, state.idle, state.personal];
            wsChart.update();
        }

        // 4. HÀM XỬ LÝ SỰ KIỆN CLICK NÚT
        function increment(type) {
            // Rung nhẹ điện thoại (nếu hỗ trợ) để tạo cảm giác feedback vật lý
            if (navigator.vibrate) navigator.vibrate(50); 

            if (type === 'working') state.working++;
            if (type === 'idle') state.idle++;
            if (type === 'personal') state.personal++;

            updateUI();
        }

        // 5. HÀM RESET
        function resetData() {
            if(confirm("Bạn có chắc chắn muốn xóa toàn bộ dữ liệu đã đo và bắt đầu lại?")) {
                state.working = 0;
                state.idle = 0;
                state.personal = 0;
                // Không reset target, giữ nguyên mục tiêu
                updateUI();
            }
        }

        // 6. HÀM CẬP NHẬT MỤC TIÊU
        function updateProgress() {
            const targetInput = document.getElementById('targetObs');
            state.target = parseInt(targetInput.value) || 1;
            if (state.target < 1) {
                state.target = 1;
                targetInput.value = 1;
            }
            updateUI();
        }

        // Khởi tạo lần đầu
        document.addEventListener('DOMContentLoaded', () => {
            updateUI();
        });

    </script>
</body>
</html>
